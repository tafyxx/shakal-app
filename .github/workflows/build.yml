name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libffi-dev \
            libssl-dev \
            cmake

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython virtualenv buildozer

      - name: Build APK with Buildozer
        run: |
          # Вписываем автоматическое согласие с лицензиями Google
          echo "" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          
          # Запускаем сборку с автоответом 'Y' на все вопросы
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShakalStudio-APK
          path: bin/*.apk
