name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5 libncursesw5 libtinfo5 cmake libffi-dev libssl-dev \
            libjpeg-dev libpng-dev ffmpeg

      - name: Install latest Buildozer and p4a from master
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv
          pip install git+https://github.com/kivy/python-for-android.git
          pip install git+https://github.com/kivy/buildozer.git

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShakalStudio-APK
          path: bin/*.apk
